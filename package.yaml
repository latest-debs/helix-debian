# Package definition for helix

package_name: helix
github_repo: helix-editor/helix
artifact_format: tar.xz
description: "A post-modern modal text editor."
license: MPL-2.0
# helix ships hx binary + runtime/ directory (246 ELF .so libs) at top-level,
# needs bundle to preserve runtime alongside the binary
bundle: true

# Build for all Debian suites and all supported architectures.

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
